<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Verma — HIRE ME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .container {
      max-width: 440px;
      width: 100%;
      background: #121118;
      border: 1px solid rgba(124, 77, 255, 0.35);
      border-radius: 28px;
      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(124, 77, 255, 0.2);
    }
    .image-wrap {
      width: 100%;
      max-height: 420px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      background: #181722;
      margin-bottom: 24px;
    }
    .image-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(124, 77, 255, 0.7);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 20px;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: -0.01em;
      line-height: 1.4;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c4dff 0%, #6536eb 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(124, 77, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(124, 77, 255, 0.55);
    }
  </style>
